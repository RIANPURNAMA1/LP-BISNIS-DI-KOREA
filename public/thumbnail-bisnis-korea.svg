<svg width="1280" height="720" viewBox="0 0 1280 720" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="720" gradientUnits="userSpaceOnUse">
      <stop stop-color="#04112A"/>
      <stop offset="0.55" stop-color="#0A3468"/>
      <stop offset="1" stop-color="#0052A4"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(930 330) rotate(90) scale(420 520)">
      <stop stop-color="#4DA8FF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#0A3468" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#FFD54A"/>
      <stop offset="1" stop-color="#FFB300"/>
    </linearGradient>
    <linearGradient id="skyline" x1="0" y1="430" x2="0" y2="720" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B2750" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#030B1B"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000814" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect width="1280" height="720" fill="url(#bg)"/>
  <rect width="1280" height="720" fill="url(#glow)"/>

  <!-- grid halus -->
  <g opacity="0.09" stroke="#BFE3FF">
    <path d="M0 120H1280M0 240H1280M0 360H1280M0 480H1280M0 600H1280"/>
    <path d="M160 0V720M320 0V720M480 0V720M640 0V720M800 0V720M960 0V720M1120 0V720"/>
  </g>

  <!-- skyline Seoul -->
  <g fill="url(#skyline)">
    <path d="M0 720V560H50V520H98V575H140V490H178V540H230V455H262V520H312V500H356V560H410V470H452V535H500V505H548V580H600V540H648V720Z"/>
    <path d="M640 720V548H690V500H730V560H780V478H812V420H818V478H846V540H900V505H948V570H1000V520H1048V470H1090V545H1140V500H1190V560H1240V520H1280V720Z"/>
  </g>
  <!-- N Seoul Tower -->
  <g fill="#0E3A78" opacity="0.95">
    <rect x="815" y="330" width="6" height="110"/>
    <rect x="800" y="440" width="36" height="14" rx="3"/>
    <path d="M806 454H830L836 540H800Z"/>
  </g>

  <!-- garis tren naik -->
  <path d="M600 560C700 540 760 500 840 440C920 380 980 360 1060 290C1110 248 1160 215 1230 170" stroke="#7BD5FF" stroke-width="5" stroke-linecap="round" opacity="0.9"/>
  <path d="M1196 168H1236V208" stroke="#7BD5FF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="840" cy="440" r="8" fill="#FFD54A"/>
  <circle cx="1060" cy="290" r="8" fill="#FFD54A"/>

  <!-- lingkaran taegeuk -->
  <g transform="translate(1030 205)" opacity="0.95" filter="url(#shadow)">
    <circle r="86" fill="#FFFFFF"/>
    <path d="M-86 0A86 86 0 0 1 86 0A43 43 0 0 1 0 0A43 43 0 0 0 -86 0Z" fill="#CD2E3A"/>
    <path d="M86 0A86 86 0 0 1 -86 0A43 43 0 0 1 0 0A43 43 0 0 0 86 0Z" fill="#0047A0"/>
  </g>

  <!-- badge program -->
  <g transform="translate(80 84)">
    <rect width="372" height="44" rx="22" fill="#FFFFFF" fill-opacity="0.12" stroke="#FFFFFF" stroke-opacity="0.35"/>
    <circle cx="26" cy="22" r="7" fill="#FFD54A"/>
    <text x="46" y="29" font-family="Arial, 'Segoe UI', sans-serif" font-weight="700" font-size="19" letter-spacing="2" fill="#FFFFFF">INDONESIA-KOREA BUSINESS PROJECT</text>
  </g>

  <!-- headline -->
  <g font-family="Impact, 'Arial Black', Arial, sans-serif" filter="url(#shadow)">
    <text x="80" y="250" font-size="64" fill="#FFFFFF" letter-spacing="1">PELUANG</text>
    <text x="80" y="352" font-size="104" fill="url(#accent)" letter-spacing="1">BISNIS</text>
    <text x="80" y="452" font-size="104" fill="#FFFFFF" letter-spacing="1">DI KOREA</text>
  </g>
  <text x="84" y="498" font-family="'Malgun Gothic', Arial, sans-serif" font-weight="700" font-size="30" fill="#BFE3FF" letter-spacing="4">한국 비즈니스 프로젝트</text>

  <!-- sub -->
  <g transform="translate(80 540)">
    <rect width="470" height="64" rx="12" fill="#FFFFFF" fill-opacity="0.12" stroke="#FFFFFF" stroke-opacity="0.3"/>
    <text x="24" y="40" font-family="Arial, 'Segoe UI', sans-serif" font-weight="700" font-size="25" fill="#FFFFFF">Penjelasan lengkap &amp; cara memulainya</text>
  </g>

  <!-- tombol play -->
  <g transform="translate(1030 520)" filter="url(#shadow)">
    <circle r="62" fill="#FFFFFF"/>
    <circle r="62" fill="none" stroke="#FFD54A" stroke-width="5"/>
    <path d="M-16 -28L34 0L-16 28Z" fill="#0052A4"/>
  </g>
  <text x="1030" y="628" text-anchor="middle" font-family="Arial, 'Segoe UI', sans-serif" font-weight="700" font-size="20" letter-spacing="3" fill="#FFFFFF">TONTON VIDEO</text>
</svg>
